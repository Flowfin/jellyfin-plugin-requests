# What a second plugin in the same server process can see of this one.
#
# #117's first condition asks for the server's plugin loading behaviour to be measured on a running
# server of each claimed line, with the commands that produced the measurement. The failure it is
# about is invisible at build time and looks exactly like the sibling not being installed, so the
# only thing that answers it is a server with two plugins in it being asked.
#
# `scripts/verify-seam-probe.sh` is what this runs and `tools/seam-probe` is the second plugin. Both
# say more about the question than a workflow file usefully can.
#
# IT RECORDED AN ANSWER AND IT NOW REFUSES ONE. While #117 listed three options for where the shared
# type comes from, a shared load context and a separate one were both results and each decided which
# of the three was available, so the only thing that redded this was a run that produced no answer at
# all. #117 took the third option on 2026-08-28 - no shared type, the handover taken by name through
# reflection - after two runs of this job measured the other two unavailable on both claimed lines,
# and `docs/seam.md` carries the choice with both measurements. So the opposite answer is a defect
# rather than a result. `scripts/read-seam-probe-answer.sh` carries the reasons and
# `scripts/prove-seam-probe-refusals.sh` is where each of them is watched biting.
#
# WHAT THE JOB MEASURES GREW WITH THE CHOICE. The probe used to stop at the lookup. Under a seam
# resolved by name at runtime, the call is where the risk sits and a lookup that answers is not a
# handover, so the probe makes the call a sibling makes and the verdict carries what became of it.
#
# It is still not a required check: the required set is a repository setting rather than a file in
# this tree, and #107 carries the criterion.
name: What a second plugin can see

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/seam-probe/**'
      - 'scripts/read-seam-probe-answer.sh'
      - 'scripts/prove-seam-probe-refusals.sh'
      - 'scripts/verify-seam-probe.sh'
      - 'scripts/server-under-test.sh'
      - 'scripts/server-image-for.sh'
      - 'scripts/server-lines.tsv'
      - 'Jellyfin.Plugin.Requests/Seam/**'
      - 'Jellyfin.Plugin.Requests/PluginServiceRegistrator.cs'
      - '.github/workflows/seam-probe.yaml'
  push:
    # The files the measurement is made of. A change to any of them makes the recorded answer a
    # claim about a procedure that has moved, so the answer is taken again.
    #
    # THE LAST TWO ARE WHAT THE PROBE IS ABOUT RATHER THAN WHAT IT IS MADE OF, and they are here
    # because the failure this job now refuses arrives through them. The probe names the contract
    # type by string, so moving that type into the contract package leaves the two constants in
    # `tools/seam-probe/ContainerReport.cs` naming nothing, and a trigger listing only the probe's
    # own files would not start the job on the change that broke it. What is still not covered is a
    # rename of the assembly itself, which lives in the project file rather than under `Seam/`.
    paths:
      - 'tools/seam-probe/**'
      - 'scripts/read-seam-probe-answer.sh'
      - 'scripts/prove-seam-probe-refusals.sh'
      - 'scripts/verify-seam-probe.sh'
      - 'scripts/server-under-test.sh'
      - 'scripts/server-image-for.sh'
      - 'scripts/server-lines.tsv'
      - 'Jellyfin.Plugin.Requests/Seam/**'
      - 'Jellyfin.Plugin.Requests/PluginServiceRegistrator.cs'
      - '.github/workflows/seam-probe.yaml'

# Explicit deny-all at workflow level; the job grants what it needs.
permissions: {}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    # The reader that decides a probe run, handed every answer it refuses, one log at a time. It
    # starts no container and needs no server, so it answers in seconds and it answers on a machine
    # that has neither. A reader nobody has watched saying no is a reader that might say yes to
    # everything, and this job is the whole of what stands behind the refusals below.
    name: the seam probe reader refuses what it says it refuses
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every answer the reader refuses, refused for its own reason
        run: |
          set -euo pipefail
          ./scripts/prove-seam-probe-refusals.sh

  probe:
    name: probe ${{ matrix.line }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    strategy:
      # Both lines whatever the other does. They are different major versions of the host, so an
      # answer from one is a claim about the other and cancelling it would leave that claim standing.
      fail-fast: false
      matrix:
        include:
          # The image is not written here. It is one half of a pair several checks need, and copies
          # of it disagree the first time a line moves, so it lives in `scripts/server-lines.tsv`
          # and the step below asks for it by the framework it already carries.
          - line: '10.11'
            framework: 'net9.0'
            port: '18098'
          - line: '12.0'
            framework: 'net10.0'
            port: '18099'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so do not leave the token in .git/config.
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Ask a second plugin what it can see
        # The matrix values arrive as environment variables rather than as expressions inside the
        # script, so nothing a later matrix takes from somewhere else can be read as shell.
        env:
          FRAMEWORK: ${{ matrix.framework }}
          PORT: ${{ matrix.port }}
        run: |
          set -euo pipefail
          IMAGE=$(./scripts/server-image-for.sh "$FRAMEWORK")
          ./scripts/verify-seam-probe.sh "$IMAGE" "$FRAMEWORK" "$PORT"
