# The build and test legs of the merge gate, in one run.
#
# This is a called workflow rather than a job in its caller, because the two
# check names the branch ruleset requires are `call / build` and `call / test`,
# and a name is matched literally: renaming a job removes a required check
# instead of renaming one, and a pull request then waits on a check that will
# never report. The caller's job is `call`, the jobs here are `build` and
# `test`, and those two names are the contract. `docs/quality-parity.md` and
# #30 are where the required set is written down.
#
# Both claimed server lines are covered by one run, because the projects
# multi-target and one command builds every target framework they declare. A
# leg per line would let one line be green while the other was never built.
name: Gate

on:
  workflow_call:

# Explicit deny-all here; each job grants only what it needs.
permissions: {}

env:
  # Both SDKs, named rather than inherited from whatever the runner image
  # happens to carry: a runner that dropped one of them would otherwise turn
  # into a build that quietly stopped covering a server line.
  DOTNET_VERSIONS: |
    9.0.x
    10.0.x
  # The gate has nothing to send anywhere and no first-run message to print.
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes via git, so do not persist the GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSIONS }}

      - name: Restore in locked mode
        # A restore that resolves a transitive package differently from what the
        # committed lockfile records fails here rather than producing a build
        # nobody can reproduce.
        run: dotnet restore Jellyfin.Plugin.Requests.sln --locked-mode

      - name: Build every claimed target framework
        # TreatWarningsAsErrors is on for every project from Directory.Build.props,
        # and -warnaserror says so again at the command, so a build that reached
        # this step with the property lowered still fails on a warning.
        run: dotnet build Jellyfin.Plugin.Requests.sln --configuration Release --no-restore -warnaserror

      - name: Show what was built
        # The target frameworks are read out of the tree rather than listed here,
        # so adding a line to the project is not also an edit to this file.
        run: find . -path '*/bin/Release/*/Jellyfin.Plugin.Requests.dll' -print

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSIONS }}

      - name: Restore in locked mode
        run: dotnet restore Jellyfin.Plugin.Requests.sln --locked-mode

      - name: Build every claimed target framework
        run: dotnet build Jellyfin.Plugin.Requests.sln --configuration Release --no-restore -warnaserror

      - name: Test every claimed target framework
        # --no-build, so the assemblies under test are the ones the step above
        # produced and not a second build made with different settings.
        #
        # Coverage is collected here rather than in a run of its own, because a
        # second run would be a second build of the same tree and would report a
        # number for code the gate did not test. The collector ships with
        # Microsoft.NET.Test.Sdk, so this adds nothing to the dependency graph.
        # Both target frameworks run and the collector writes one merged report,
        # so a line reached on either line counts as reached.
        run: >-
          dotnet test Jellyfin.Plugin.Requests.sln --configuration Release --no-build
          --collect "Code Coverage;Format=cobertura" --results-directory coverage

      - name: Hold the plugin's line coverage to its floor
        # The floor is a ratchet against drift and not a target. What it catches
        # is a change that adds code nobody tested; what it cannot catch is a
        # test that executes a line without asserting anything about it. The rule
        # in docs/testing.md carries that half, and this number is the cheap one.
        #
        # The percentage is covered lines over recorded lines for the plugin's own
        # package, which is what the report holds and what the reader can
        # recompute. The test project's own coverage is not counted: a suite
        # measuring itself says nothing.
        env:
          # Measured at 79.50% on b1d401b, the commit this step landed against.
          # Raise it when the number rises; never lower it to make a run pass.
          COVERAGE_FLOOR: "75"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import os
          import sys
          import xml.etree.ElementTree as ET

          floor = float(os.environ["COVERAGE_FLOOR"])
          reports = sorted(glob.glob("coverage/**/*.cobertura.xml", recursive=True))
          if not reports:
              # Fail closed. A run that collected nothing must not read as a run
              # that collected everything and found it fine.
              sys.exit("no coverage report was produced, so nothing was measured")

          covered = total = 0
          per_file = {}
          for report in reports:
              for package in ET.parse(report).getroot().iter("package"):
                  if package.get("name") != "Jellyfin.Plugin.Requests":
                      continue
                  for klass in package.iter("class"):
                      name = klass.get("filename", "").replace("\\", "/").split("/")[-1]
                      hit, seen = per_file.get(name, (0, 0))
                      for line in klass.iter("line"):
                          seen += 1
                          total += 1
                          if int(line.get("hits", "0")) > 0:
                              hit += 1
                              covered += 1
                      per_file[name] = (hit, seen)

          if total == 0:
              sys.exit("the report holds no lines for the plugin's own package")

          rate = 100.0 * covered / total
          lines = [
              "## Line coverage of the plugin",
              "",
              f"**{rate:.2f}%** of {total} recorded lines, floor {floor:.2f}%.",
              "",
              "| File | Covered | Recorded |",
              "| --- | ---: | ---: |",
          ]
          for name in sorted(per_file):
              hit, seen = per_file[name]
              lines.append(f"| {name} | {hit} | {seen} |")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines) + "\n")

          print(f"::notice title=Line coverage::{rate:.2f}% of {total} lines, floor {floor:.2f}%")
          print(f"line coverage {rate:.2f}% over {total} lines, floor {floor:.2f}%")
          if rate < floor:
              sys.exit(f"line coverage {rate:.2f}% is below the floor of {floor:.2f}%")
          PY
