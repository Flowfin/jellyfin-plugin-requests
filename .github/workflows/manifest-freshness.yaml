# Does the document a server fetches still offer what this board has released?
#
# #111's second condition, and it is the half of that issue that does not trust the workflow which
# published. The incident it is written against happened on the sibling SSO board: the release was
# created, the manifest commit failed, and the successful publish shipped nothing installable. A
# check inside the publish cannot catch that, because the step that failed is the step that would
# have had to report it. So this runs on its own schedule, fetches the manifest an operator's server
# fetches, and reads it against the releases that exist.
#
# WHAT IT DOES NOT DO ON ITS OWN, SAID HERE RATHER THAN DISCOVERED. It raises nothing by itself. A
# red run of this workflow sits in a run list, and that is #111's third condition rather than this
# workflow's job.
#
# WHAT CARRIES THAT CONDITION IS A SWEEP ON THIS BOARD, AND THIS COMMENT NAMED TWO EARLIER ANSWERS
# THAT DID NOT. It first said the fleet sweep on `iderex/wache#31` would raise it once that sweep's
# credential landed; the credential landed, the sweep was built and merged, and what it reads is open
# code-scanning, Dependabot and secret-scanning counts per board rather than any board's workflow-run
# conclusions. It then said the condition named no mechanism at all. It names one now:
# `publish-failure-alert.yaml`, which asks the run list which runs on the default branch concluded
# non-success, and files, updates and closes one issue for what it finds. It watches every workflow
# here rather than this one, so nothing has to be registered with it when a workflow is added.
#
# The residual it leaves is written in that file rather than restated here, and the shortest part of
# it is that a sweep cannot sweep up its own failure. Whether the platform's own notice of a failed
# scheduled run reaches anybody is a per-account setting nothing here can read, and it is not
# evaluated either way.
#
# The reading is `scripts/check-manifest-is-fresh.sh` and every refusal it makes is watched biting in
# `scripts/prove-manifest-freshness-refusals.sh`, which needs no network and runs on every pull
# request touching either file. A reader nobody has watched saying no is a reader that might say yes
# to everything - and this one is green on the day it lands and stays green for as long as nothing
# goes wrong, which is exactly the situation the incident arose in.
#
# THE ADDRESS IS NOT WRITTEN TWICE. `docs/catalogue.md` is where the manifest URL an operator adds is
# recorded, and the step below reads it out of that file rather than carrying a second copy that
# would go stale the first time the address moves.
#
# THIS IS NOT A REQUIRED CHECK. The required set is a repository setting rather than a file in this
# tree, and #107 carries the criterion.
name: Manifest freshness

on:
  schedule:
    # Once a day, well away from the hour. A release is not published on a schedule, so what this
    # bounds is how long a manifest that never learned of one stays unreported, and a day is short
    # against the time such a thing has previously gone unnoticed.
    - cron: '17 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/check-manifest-is-fresh.sh'
      - 'scripts/prove-manifest-freshness-refusals.sh'
      - '.github/workflows/manifest-freshness.yaml'
      - 'build.yaml'
      - 'build-*.yaml'
      - 'docs/catalogue.md'
  push:
    branches: [master]
    paths:
      - 'scripts/check-manifest-is-fresh.sh'
      - 'scripts/prove-manifest-freshness-refusals.sh'
      - '.github/workflows/manifest-freshness.yaml'
      - 'build.yaml'
      - 'build-*.yaml'
      - 'docs/catalogue.md'

# Explicit deny-all at workflow level; each job grants only what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    # The reader that decides a freshness run, handed every answer it refuses, one pair of files at a
    # time. It fetches nothing and needs no release, so it answers in seconds and it answers on a
    # machine with no network.
    name: the freshness check refuses what it says it refuses
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every answer the reader refuses, refused for its own reason
        run: |
          set -euo pipefail
          ./scripts/prove-manifest-freshness-refusals.sh

  compare:
    name: the manifest offers what this board has released
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the manifest an operator's server would fetch
        run: |
          set -euo pipefail

          # Read out of the document that records it rather than written here. `docs/catalogue.md`
          # is where the address an operator adds lives, so a manifest that moves moves in one file.
          address=$(grep -oE 'https://[^ )]*manifest\.json' docs/catalogue.md | head -1)
          if [ -z "${address}" ]; then
            echo "::error::docs/catalogue.md names no manifest address, so there is nothing to fetch. The address an operator adds is recorded there and this step reads it rather than carrying a copy."
            exit 1
          fi
          echo "fetching ${address}"

          # A fetch that fails is a different answer from a manifest that disagrees, and it is not
          # this check's subject: the network between a runner and a host is not something this
          # board can fix. It is still a failure, because a manifest nobody can fetch is a manifest
          # nobody can install from, and the message says which of the two happened.
          code=$(curl -sS --retry 3 --retry-delay 5 --max-time 60 \
                   -o "${RUNNER_TEMP}/manifest.json" -w '%{http_code}' "${address}" || echo "000")
          echo "the fetch answered ${code}"
          if [ "${code}" != "200" ]; then
            echo "::error::Fetching ${address} answered ${code} rather than 200. That is the manifest being unreachable rather than out of date, and a server adding this repository meets the same thing."
            exit 1
          fi

      - name: List the releases that exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "${GITHUB_REPOSITORY}" --limit 200 \
            --json tagName --jq '.[].tagName' > "${RUNNER_TEMP}/releases.txt"
          echo "releases:"
          cat "${RUNNER_TEMP}/releases.txt"

      - name: Compare the newest release of each claimed line against it
        run: |
          set -euo pipefail
          ./scripts/check-manifest-is-fresh.sh "${RUNNER_TEMP}/manifest.json" "${RUNNER_TEMP}/releases.txt"
