# The greppable invariants of this repository, one rule per invariant.
#
# Some rules here are not expressible as a compiler warning and are trivially
# expressible as a pattern. A document can only ask for them; this file is where
# a machine refuses them. A rule is added the first time an invariant is decided,
# not in a batch afterwards, and the comment above each rule names where the
# decision was taken so a reader can argue with the decision rather than with the
# pattern.
#
# Every rule is `generic` mode, which matches token sequences and needs no
# language parser. That is deliberate: a C# parser that mis-parses a file turns a
# refusal into silence, and a rule that can go quiet without anybody noticing is
# worse than no rule.
#
# Every rule carries a fixture under fixtures/, and its own `paths.include` names
# that fixture directory beside the real subject. `prove-rules-fire.sh` scans the
# fixtures and fails unless every declared rule fires on one, so a rule that
# stopped matching anything reds the gate instead of passing quietly. The tree
# scan excludes the fixture directory; if that exclusion is ever dropped the tree
# scan reds on the fixtures rather than going green.
#
# The clean tree is the negative half of the same proof: every rule below reports
# nothing against the repository as it stands, so a finding is a regression and
# never the state of the tree.
rules:
  # Invariant (release path): a release is published by pushing a tag, and
  # nothing is created by hand. Decided in docs/RELEASING.md and stated again at
  # the top of .github/workflows/publish.yaml. A GitHub release is immutable once
  # it exists, so a hand-made release permanently burns the tag it was made for
  # and skips every check in the gate job that the tag push runs. The read-only
  # verbs are deliberately not refused: docs/versioning.md counts releases with
  # `gh release list` and a count is not a mutation.
  - id: release-created-only-by-a-tag-push
    languages: [generic]
    severity: ERROR
    message: >-
      Do not create, edit, delete or upload a GitHub release by hand. Publishing
      is a tag push and nothing else, because a release is immutable and a
      hand-made one burns the tag and skips the release metadata gate. Read-only
      verbs such as `gh release list` and `gh release view` are allowed.
    patterns:
      - pattern-either:
          - pattern: gh release create
          - pattern: gh release edit
          - pattern: gh release delete
          - pattern: gh release upload
          - pattern: gh release delete-asset
    paths:
      include:
        - ".github/workflows/**"
        - "docs/**"
        - "scripts/**"
        - "tools/**"
        - "**/*.sh"
        - "**/*.ps1"
      exclude:
        # This file necessarily contains the refused verbs as its own patterns.
        - "tools/opengrep/rules.yaml"

  # Invariant (model): the request record is immutable, and a move produces a new
  # value with `with` rather than an edit in place. Decided in
  # Jellyfin.Plugin.Requests/Model/MediaRequest.cs, which says so in the type's
  # own documentation. A settable property lets a caller move a request behind
  # the back of the transition table and of the append-only history, which is the
  # one thing the immutability was chosen to make impossible. `init` is the shape
  # that stays legal; `set` in any accessibility is the regression.
  - id: request-model-property-is-not-settable
    languages: [generic]
    severity: ERROR
    message: >-
      A property under Model/ may not have a setter. The request record is
      immutable and a move produces a new value with `with`, so that no caller
      can change a request without going through the transition table and the
      history. Use `init` instead of `set`.
    patterns:
      - pattern: set;
    paths:
      include:
        - "Jellyfin.Plugin.Requests/Model/**/*.cs"
        - "tools/opengrep/fixtures/model/**/*.cs"

  # Invariant (time, #34): the plugin reads the time through the injected IClock
  # and never off the machine. Decided in #34, whose done-when names this rule.
  # Code that reads the wall clock can only be tested by waiting for it, so the
  # test either sleeps, which makes it slow and then flaky, or it is written
  # around the rule it was meant to check. SystemClock is the one place the wall
  # clock enters, and it is excluded here because it is the implementation this
  # rule points everything else at.
  - id: clock-read-only-through-the-injected-clock
    languages: [generic]
    severity: ERROR
    message: >-
      Do not read the machine's clock here. Take an IClock and read IClock.UtcNow,
      so a rule about retention, staleness or ordering can be tested by moving a
      clock instead of by waiting (#34). SystemClock is the one place the wall
      clock is read.
    patterns:
      - pattern-either:
          - pattern: DateTime.UtcNow
          - pattern: DateTime.Now
          - pattern: DateTime.Today
          - pattern: DateTimeOffset.UtcNow
          - pattern: DateTimeOffset.Now
    paths:
      include:
        - "Jellyfin.Plugin.Requests/**/*.cs"
        - "tools/opengrep/fixtures/clock/**/*.cs"
      exclude:
        - "Jellyfin.Plugin.Requests/Time/SystemClock.cs"

  # Invariant (identity, #34): a request's identifier comes from the injected
  # IIdentifierSource and never from the framework's generator. Decided in #34,
  # whose done-when names this rule. An identifier a test cannot predict is one a
  # test cannot assert on, so a suite ends up reading back whatever the code
  # produced and comparing it to itself, which passes for any value including the
  # wrong one. GuidIdentifierSource is the one place the generator is called.
  - id: identifier-minted-only-by-the-identifier-source
    languages: [generic]
    severity: ERROR
    message: >-
      Do not mint an identifier here. Take an IIdentifierSource and call NewId,
      so a test knows which identifier the next request will carry (#34).
      GuidIdentifierSource is the one place the framework's generator is called.
    patterns:
      - pattern: Guid.NewGuid(...)
    paths:
      include:
        - "Jellyfin.Plugin.Requests/**/*.cs"
        - "tools/opengrep/fixtures/identity/**/*.cs"
      exclude:
        - "Jellyfin.Plugin.Requests/Identity/GuidIdentifierSource.cs"

  # Invariant (suite, #34): no test waits for real time to pass. Decided in #34,
  # whose done-when is the grep this rule makes standing rather than a state
  # somebody checked once. The headless rule in docs/testing.md names real
  # wall-clock waiting among the things a test may not need. A sleep is what
  # somebody reaches for first when a timing test fails, and it converts a
  # reproducible failure into one that depends on how busy the machine is.
  - id: no-waiting-in-a-test
    languages: [generic]
    severity: ERROR
    message: >-
      Do not wait in a test. Advance the TestClock instead, which moves time by
      as much as the rule under test needs and takes none of it (#34). A sleep
      makes a failure depend on how busy the machine is.
    patterns:
      - pattern-either:
          - pattern: Thread.Sleep(...)
          - pattern: Task.Delay(...)
    paths:
      include:
        - "Jellyfin.Plugin.Requests.Tests/**/*.cs"
        - "tools/opengrep/fixtures/sleep/**/*.cs"

  # Invariant (suite): the plugin is constructed in exactly one place, the
  # PluginHost double. Decided in
  # Jellyfin.Plugin.Requests.Tests/Doubles/PluginHost.cs, which says so in its
  # own documentation. Every host service the plugin injects is passed from that
  # one call site, so a new constructor parameter stops the suite from building
  # until its double exists. A second call site anywhere else is what quietly
  # removes that property.
  - id: plugin-constructed-only-by-the-host-double
    languages: [generic]
    severity: ERROR
    message: >-
      Construct the plugin through the PluginHost double rather than calling its
      constructor here. One call site is what makes a new host service a build
      failure in the suite instead of a test that silently passes a null.
    patterns:
      - pattern-either:
          - pattern: new Plugin(...)
          - pattern: new PluginUnderTest(...)
    paths:
      include:
        - "Jellyfin.Plugin.Requests.Tests/**/*.cs"
        - "tools/opengrep/fixtures/suite/**/*.cs"
      exclude:
        - "Jellyfin.Plugin.Requests.Tests/Doubles/PluginHost.cs"

  # Invariant (headless, #115): no browser automation package is referenced
  # anywhere in this repository. Decided in docs/testing.md, whose first refusal
  # is a browser-driven test of the administrator page and whose replacement is
  # the endpoints tested in process. A package reference is how a display
  # requirement arrives: nothing about the reference itself needs a display, and
  # the first test written against it downloads a browser per machine and turns
  # the suite into something a machine without one cannot run. The lock files are
  # named beside the project files so a driver arriving as somebody else's
  # dependency is refused too.
  #
  # What it does not reach: the four families below are the ones a .NET driver
  # comes from today, matched case-sensitively against the canonical package
  # identifier, which is the casing every file this rule reads carries. A fifth
  # family is a fifth pattern here, and nothing finds one for you.
  - id: no-browser-automation-package
    languages: [generic]
    severity: ERROR
    message: >-
      Do not reference a browser automation package. A browser-driven test needs
      a display or a per-machine browser download, which docs/testing.md refuses;
      test the endpoints the page calls in process instead (#115).
    patterns:
      - pattern-either:
          - pattern: Playwright
          - pattern: Selenium
          - pattern: Puppeteer
          - pattern: WebDriver
    paths:
      include:
        - "**/*.csproj"
        - "**/*.props"
        - "**/*.targets"
        - "**/packages.lock.json"
        - "tools/opengrep/fixtures/display/**"

  # Invariant (headless, #115): nothing in this tree reaches into a certificate
  # store. Decided in docs/testing.md, which refuses a test needing an elevation
  # or consent prompt and names a write to a machine trust store as one form of
  # it. A trust store is shared with every other program on the machine and
  # outlives the run that changed it, so this is the one refusal whose cost is
  # paid by somebody who never ran the suite. X509Store is the whole managed
  # entry point, because a store cannot be opened without constructing one;
  # StoreName and StoreLocation are only ever its arguments and are left out
  # rather than listed, so this rule cannot red on a storage type that happens to
  # carry one of those words. `dotnet dev-certs` and `certutil` are the two
  # command-line spellings of the same write.
  - id: no-certificate-store-access
    languages: [generic]
    severity: ERROR
    message: >-
      Do not open or write a certificate store. It raises a consent prompt and
      changes what every other program on the machine trusts, long after the run
      ends, which docs/testing.md refuses (#115). Reach the client through an
      in-process handler instead of trusting a certificate.
    patterns:
      - pattern-either:
          - pattern: X509Store
          - pattern: dotnet dev-certs
          - pattern: certutil
    paths:
      include:
        - "**/*.cs"
        - "**/*.sh"
        - "**/*.ps1"
        - ".github/workflows/**"
        - "tools/opengrep/fixtures/truststore/**"

  # Invariant (headless, #115): the suite names no location outside the directory
  # the run owns. Decided in Jellyfin.Plugin.Requests.Tests/Doubles/TestRunDirectory.cs,
  # which is that directory and says so. The suite already asserts that every
  # double is rooted under it, and a test that never went through a double is
  # invisible to those assertions: it asks the machine for a temporary path, a
  # known folder or the working directory, and writes beside everything else that
  # uses them. Walking the machine's temporary root at the end of a run is the
  # other way to catch that and is deliberately not done, because that root is
  # shared with every process running as the same user and such a check reds for
  # a file nobody in this repository created. This is the half that names a
  # source line instead. TestRunDirectoryTests is excluded with the directory
  # itself, because the assertion that the run's directory sits directly under
  # the machine's temporary root has to name that root to make it.
  #
  # What it does not reach, and deliberately. AppContext.BaseDirectory is not
  # refused: it is the test host's own output directory, it is where the
  # packaging metadata is copied to be read, and nothing in the suite writes
  # through it. A rooted path written as a literal is not refused either, because
  # a pattern for one matches every version string and every URL in the suite,
  # and a rule that reds on those is a rule somebody switches off. This catches
  # the four calls that ask the machine where to put something, which is how a
  # test that never went through a double actually gets written.
  - id: suite-writes-only-under-the-run-directory
    languages: [generic]
    severity: ERROR
    message: >-
      Do not ask the machine for a location here. Take a subdirectory of
      TestRunDirectory, which is the one directory a run owns and removes, so a
      test cannot write beside everything else on a shared machine (#115).
    patterns:
      - pattern-either:
          - pattern: Path.GetTempPath(...)
          - pattern: Path.GetTempFileName(...)
          - pattern: Environment.GetFolderPath(...)
          - pattern: Environment.SpecialFolder
          - pattern: Environment.CurrentDirectory
          - pattern: Directory.GetCurrentDirectory(...)
          - pattern: Directory.SetCurrentDirectory(...)
    paths:
      include:
        - "Jellyfin.Plugin.Requests.Tests/**/*.cs"
        - "tools/opengrep/fixtures/runpath/**/*.cs"
      exclude:
        - "Jellyfin.Plugin.Requests.Tests/Doubles/TestRunDirectory.cs"
        - "Jellyfin.Plugin.Requests.Tests/TestRunDirectoryTests.cs"

  # Invariant (model, #43): the history on a request is only ever appended to.
  # Decided in #43, whose second done-condition names this rule. Entries are
  # never edited or removed, and that is the only thing that makes the list
  # worth reading: a history somebody can tidy answers "what happened" with
  # whatever the last writer preferred. Nothing in the type system says so,
  # because IReadOnlyList refuses a removal and says nothing about an
  # assignment, and `with { History = ... }` is exactly how a caller would
  # replace one. RequestLifecycle is the one place that appends, so it is the
  # one place excluded.
  - id: history-is-only-appended-to
    languages: [generic]
    severity: ERROR
    message: >-
      Do not assign to History here. A request's history is append-only and
      RequestLifecycle is the only thing that grows it, so that a move cannot be
      rewritten out of the record after the fact (#43).
    patterns:
      - pattern: History =
    paths:
      include:
        - "Jellyfin.Plugin.Requests/**/*.cs"
        - "tools/opengrep/fixtures/history/**/*.cs"
      exclude:
        - "Jellyfin.Plugin.Requests/Model/RequestLifecycle.cs"

  # Invariant (api, #50): every endpoint this plugin serves sits under the
  # versioned prefix, and the prefix is declared in exactly one place. Decided in
  # docs/api.md, whose version rule is worth nothing if an endpoint can sit
  # outside the segment the rule is about: a caller pinned to v1 would reach a
  # route that has no version at all and would break on a change the rule said
  # was safe.
  #
  # Two spellings get out of the prefix and both are refused. A second `[Route]`
  # attribute anywhere replaces the inherited one for that controller.
  # `[HttpGet("/...")]`, with a leading slash, is the quieter of the two: the
  # template looks like a relative path with a typo, and ASP.NET treats it as an
  # absolute route that discards the controller's prefix entirely.
  #
  # RequestsControllerBase is the one place excluded, because it is the file that
  # declares the prefix this rule exists to hold everything else to.
  - id: every-endpoint-sits-under-the-versioned-prefix
    languages: [generic]
    severity: ERROR
    message: >-
      Do not declare a route here. Every endpoint inherits the versioned prefix
      from RequestsControllerBase, and a route attribute of its own, or a method
      template beginning with a slash, puts an endpoint outside the version the
      compatibility rule in docs/api.md is written about (#50).
    patterns:
      - pattern-either:
          - pattern: '[Route(...)]'
          - pattern: '[HttpGet("/...")]'
          - pattern: '[HttpPost("/...")]'
          - pattern: '[HttpPut("/...")]'
          - pattern: '[HttpPatch("/...")]'
          - pattern: '[HttpDelete("/...")]'
    paths:
      include:
        - "Jellyfin.Plugin.Requests/**/*.cs"
        - "tools/opengrep/fixtures/route/**/*.cs"
      exclude:
        - "Jellyfin.Plugin.Requests/Api/RequestsControllerBase.cs"

  # Invariant (api, #51): nothing this plugin serves is reachable without a
  # session. Decided in docs/api.md, which sets out which policy each endpoint
  # carries and why none of them is anonymous. A request has to be attributable
  # to somebody to exist at all, and a queue is a list of who asked for what, so
  # there is no endpoint here whose answer is safe to give a caller the server
  # has not authenticated. `[AllowAnonymous]` is the one attribute that turns
  # every policy above it off, including the controller's, and it is what
  # somebody writes while testing an endpoint by hand.
  - id: no-anonymous-endpoint
    languages: [generic]
    severity: ERROR
    message: >-
      Do not make an endpoint anonymous. Every endpoint this plugin serves
      carries a policy and none of them is reachable without a session (#51);
      AllowAnonymous turns off the controller's policy as well as the method's.
    patterns:
      - pattern: '[AllowAnonymous]'
    paths:
      include:
        - "Jellyfin.Plugin.Requests/**/*.cs"
        - "tools/opengrep/fixtures/policy/**/*.cs"

  # Invariant (api, #51): a policy this plugin names is one the server registers,
  # and the way that is held is that the name comes from the server's own
  # constant rather than from a string here. Decided in docs/api.md.
  #
  # This rule replaced one that said the opposite, and the reason is measured
  # rather than argued. The rule here refused a bare `[Authorize]` and asked for
  # a named policy instead, on the reading that a name is always narrower than
  # the default. That is false for the one case it mattered in: the server
  # registers no name for "any signed-in person" and builds the requirement into
  # its unnamed default policy, so the name written here for it,
  # `DefaultAuthorization`, was a name nothing registers. An endpoint under an
  # unregistered policy does not admit fewer people, it throws inside the
  # authorisation middleware, and every endpoint this plugin serves answered 500
  # to every caller on both claimed lines. docs/api.md carries the run.
  #
  # So the shape refused is the string, in either direction: a name that is
  # correct today is still a name nothing checks, and the constants are in
  # MediaBrowser.Common, which this plugin already references. Taking the name
  # from there makes a policy the server does not register a compile error. An
  # endpoint open to any signed-in caller carries `[Authorize]` with nothing
  # after it, which is what the server's own controllers carry for the same
  # thing, and no-anonymous-endpoint is what keeps that from sliding to open.
  - id: policy-is-named-by-the-servers-own-constant
    languages: [generic]
    severity: ERROR
    message: >-
      Do not write a policy name as a string. Take it from Policies in
      MediaBrowser.Common, so a name the server does not register is a compile
      error rather than an endpoint that answers 500 to everybody (#51). An
      endpoint open to any signed-in person carries [Authorize] and no policy,
      which is the server's default.
    patterns:
      - pattern: '[Authorize(Policy = "...")]'
    paths:
      include:
        - "Jellyfin.Plugin.Requests/**/*.cs"
        - "tools/opengrep/fixtures/policy/**/*.cs"

  # Invariant (model, #54): a request's state is written by RequestLifecycle and
  # by nothing else. Decided in docs/lifecycle.md, which until now carried this
  # as the paragraph headed "What is not enforced": the record is immutable, so
  # a move produces a new value rather than going through the two methods that
  # make one, and a surface could write its own. What that walks past is the
  # transition table, the check on who may make the move, and the one history
  # entry a move appends, which is three of this plugin's rules at once.
  #
  # What is refused is a state literal written onto a request. That is the shape
  # a surface reaches for when it has a state in mind and the model in the way,
  # and it is one line every time it is written, so a spelling spread over
  # several lines is not a way around it.
  #
  # What is NOT refused, and is named here so the rule is not read as wider than
  # it is: a state held in a variable first, then written. Refusing that means
  # refusing the token `State =`, which is how every projection of a request into
  # a response shape is written and would red the gate on correct code.
  #
  # The test project is deliberately outside the path list. A store's conformance
  # suite has to put a request into a state the lifecycle would not move it into
  # from where it is, because what it is testing is the store rather than the
  # move, and those requests are fixtures rather than decisions anybody made.
  #
  # RequestLifecycle needs no exclusion, which is worth saying because every
  # other rule here has one. It writes the state it was handed rather than one it
  # names, so the one place allowed to make a move does not match the pattern for
  # making one badly. What that costs is that the rule cannot be read out of the
  # file it holds: the pattern is quoted nowhere in the plugin, this comment
  # included, because a comment quoting it would be refused by the rule it
  # documents.
  - id: state-written-only-by-the-lifecycle
    languages: [generic]
    severity: ERROR
    message: >-
      Do not write a request's state here. RequestLifecycle.Move and
      RequestLifecycle.Decline are the two doors, and they carry the transition
      table, who may make the move, and the one history entry a move appends
      (#54). A state written straight onto the record walks past all three.
    patterns:
      - pattern: 'State = RequestState.'
    paths:
      include:
        - "Jellyfin.Plugin.Requests/**/*.cs"
        - "tools/opengrep/fixtures/lifecycle/**/*.cs"

  # Invariant (catalogue, #92): this plugin asks no metadata source about
  # anything. Decided in #92 and stated in docs/seam.md: the catalogue belongs to
  # the sibling browsing plugin, and what this side holds is a title and a year
  # taken at the moment of the request and never refreshed. Two catalogues on one
  # server is a cost nobody would choose twice, and fetching from a source also
  # brings that source's terms onto whoever fetched.
  #
  # What it reaches: the server's own provider interfaces, which are how a plugin
  # asks the host to fetch or refresh metadata, and the addresses of the sources
  # a plugin would otherwise call directly. The message names the snapshot,
  # because the repair is almost always to read what the request already carries.
  #
  # What it does not reach, on purpose: an outbound call in general. The
  # notification sink in #78 and the bridge in #82 are outbound by design, so a
  # rule refusing every HTTP client here would have to be narrowed by whoever
  # lands them, and a rule narrowed to let work through is one nobody trusts
  # afterwards. What keeps an HTTP stack from arriving unnoticed is the exact
  # reference list in SiblingIndependenceTests, which fails on any addition.
  - id: no-call-to-a-metadata-source
    languages: [generic]
    severity: ERROR
    message: >-
      Do not ask a metadata source about a title here. The catalogue is the
      sibling browsing plugin's (#92), and what this plugin holds is the display
      snapshot taken when the request was made, which is what lets the queue
      render with nothing outbound reachable.
    patterns:
      - pattern-either:
          - pattern: IProviderManager
          - pattern: IRemoteMetadataProvider
          - pattern: IRemoteImageProvider
          - pattern: IMetadataProvider
          - pattern: MediaBrowser.Providers
          - pattern: api.themoviedb.org
          - pattern: api.thetvdb.com
          - pattern: api4.thetvdb.com
          - pattern: webservice.fanart.tv
          - pattern: musicbrainz.org
          - pattern: omdbapi.com
    paths:
      include:
        - "Jellyfin.Plugin.Requests/**/*.cs"
        - "tools/opengrep/fixtures/metadata/**/*.cs"
