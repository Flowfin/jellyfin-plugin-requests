---
# Packaging metadata for the Jellyfin 12.0 line. One plugin, two packages: a 10.11 server provides
# .NET 9 and a 12.0 server provides .NET 10, and a plugin compiled for one runtime does not load on
# the other. The identity fields below are word-identical with build.yaml on purpose, because a
# catalogue holds one entry per plugin and a divergence there makes the entry flip between two texts
# depending on which package was published last.
name: "Requests"
# Same identifier as build.yaml, so a server that moves from 10.11 to 12.0 updates this plugin in
# place instead of gaining a second, unrelated one. Both files carry the minted identifier and
# PackagingMetadataTests.BothPackagesClaimTheSameIdentity refuses them diverging on it.
guid: "0f9c9107-b31b-459e-81fa-6d35dac25e79"
imageUrl: "https://raw.githubusercontent.com/Flowfin/jellyfin-plugin-requests/master/img/logo.png"
version: "0.2.0.0"
# The 12.0 line's floor and the runtime it provides.
targetAbi: "12.0.0.0"
framework: "net10.0"
overview: "A user asks the server for a film or a series, an administrator answers it in a queue. Under development."
description: >
  A user who cannot find something asks for it from inside Jellyfin rather than through a message to whoever runs the server. The ask lands in a queue an administrator works through, and the person who asked can see what happened to it.

  This is not finished and there is no release yet. The tree holds the plugin shell and one data model. Installing it today adds nothing a user can see.
category: "General"
owner: "Flowfin"
artifacts:
- "Jellyfin.Plugin.Requests.dll"
changelog: >
  changelog
