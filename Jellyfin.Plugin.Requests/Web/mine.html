<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title data-i18n="mine.title"></title>

        <!--
            The style is here rather than in the shared stylesheet the dashboard pages use. That
            file is reachable only under a name registered as a plugin page, and the dashboard
            serves those to an administrator, so a user opening this page would meet a refusal
            instead of a stylesheet. The same is true of the shared script, which is why nothing
            below reaches for it either.
        -->
        <style>
            :root {
                color-scheme: light dark;
            }

            body {
                font-family: system-ui, sans-serif;
                margin: 0;
                padding: 1.5rem;
                line-height: 1.5;
            }

            h1 {
                font-size: 1.5rem;
                margin-top: 0;
            }

            table {
                border-collapse: collapse;
                width: 100%;
            }

            caption {
                text-align: left;
                padding-bottom: 0.5rem;
            }

            th,
            td {
                border-bottom: 1px solid rgba(128, 128, 128, 0.4);
                padding: 0.4rem 0.6rem;
                text-align: left;
                vertical-align: top;
            }
        </style>
    </head>
    <body>
        <main id="RequestsMinePage">
            <!--
                Every word on this page arrives from the catalogue endpoint rather than being
                written here, which is #73. A `data-i18n` attribute names the key and the element
                ships empty, so a page that reached a browser before its words did shows nothing
                rather than showing English to somebody who asked for another language.
            -->
            <h1 data-i18n="mine.title"></h1>

            <!--
                What this page is and is not. It shows one person their own requests and offers no
                decision, because a decision is an administrator's and the endpoints that make one
                require elevation. The one control it holds is below, and it is the only kind that
                belongs here: a setting about this person rather than about a request. Cancelling
                something still open is still absent, because it needs a state a request can be
                withdrawn into, which is an open decision on #113.
            -->
            <p class="requestsMineMessage" role="status"></p>

            <!--
                The switch on what this plugin pushes at the person reading the page. It ships
                hidden and is revealed once the endpoint has answered, so a page that could not
                reach it shows no control rather than an unchecked box that reads as "off".
            -->
            <p class="requestsMineNotices" hidden>
                <input type="checkbox" id="RequestsMineNotices" />
                <label for="RequestsMineNotices" data-i18n="mine.notices.label"></label>
            </p>

            <table>
                <caption class="requestsMineSummary" aria-live="polite"></caption>
                <thead>
                    <tr>
                        <th scope="col" data-i18n="mine.column.title"></th>
                        <th scope="col" data-i18n="mine.column.kind"></th>
                        <th scope="col" data-i18n="mine.column.state"></th>
                        <th scope="col" data-i18n="mine.column.whatNext"></th>
                        <th scope="col" data-i18n="mine.column.requestedAt"></th>
                        <th scope="col" data-i18n="mine.column.stateChangedAt"></th>
                        <th scope="col" data-i18n="mine.column.availability"></th>
                        <th scope="col" data-i18n="mine.column.yourNote"></th>
                        <th scope="col" data-i18n="mine.column.why"></th>
                    </tr>
                </thead>
                <tbody class="requestsMineRows"></tbody>
            </table>
        </main>

        <script type="text/javascript">
            (function () {
                var page = document.querySelector("#RequestsMinePage");
                var rows = page.querySelector(".requestsMineRows");
                var summary = page.querySelector(".requestsMineSummary");
                var message = page.querySelector(".requestsMineMessage");
                var notices = page.querySelector(".requestsMineNotices");
                var noticesBox = page.querySelector("#RequestsMineNotices");

                /*
                 * The largest page the endpoint serves. This page asks for it in one call and has
                 * no pager, because a pager is a control and the only thing this page is for is
                 * reading. Where somebody has more requests than that, the caption below says how
                 * many matched as well as how many are drawn, so a person is never shown a
                 * shortened list that reads as the whole of it.
                 */
                var most = 200;

                /*
                 * The words, once they have arrived. Empty until then, and a lookup against an
                 * empty catalogue answers with nothing rather than with a key: showing somebody
                 * `mine.column.why` is showing them the inside of the plugin.
                 *
                 * What that costs, stated rather than left to be found: a catalogue that cannot be
                 * fetched leaves this page wordless, including the sentence below that would say
                 * so. It is not a failure of its own, because the catalogue and the caller's own
                 * requests are two calls to the same server behind the same credential, so a page
                 * that cannot reach one cannot reach the other either.
                 */
                var words = {};

                function word(key) {
                    return Object.prototype.hasOwnProperty.call(words, key) ? words[key] : "";
                }

                /*
                 * A sentence with values put into it, where the catalogue holds the sentence and
                 * this holds none of it. The placeholders are numbered rather than named so a
                 * translator can move them, which is the whole reason a sentence is one string
                 * instead of three pieces joined in this file.
                 */
                function say(key, values) {
                    return word(key).replace(/\{(\d+)\}/g, function (whole, at) {
                        var value = values[Number(at)];

                        return value === undefined ? whole : String(value);
                    });
                }

                /*
                 * Where this page reads from, resolved against its own address rather than built
                 * from a host and a path. The endpoint that answers with the caller's own requests
                 * is this page's sibling under the same versioned prefix, so a server behind a base
                 * path is followed without this page knowing there is one.
                 *
                 * The credential is the one this page was opened with and is carried no further
                 * than the call. A browser navigating to an address sends no Jellyfin session, so
                 * the only way to reach an authenticated page in one is in the address itself; the
                 * server reads it from there on both claimed lines. Nothing here stores it, and
                 * docs/surface.md says plainly what that costs.
                 */
                function address(endpoint, asked) {
                    var target = new URL(endpoint, window.location.href);
                    var opened = new URLSearchParams(window.location.search);
                    var carried = opened.get("api_key") || opened.get("ApiKey");

                    Object.keys(asked || {}).forEach(function (name) {
                        target.searchParams.set(name, String(asked[name]));
                    });

                    if (carried) {
                        target.searchParams.set("api_key", carried);
                    }

                    return target;
                }

                function fetched(endpoint, asked) {
                    return fetch(address(endpoint, asked), { headers: { Accept: "application/json" } }).then(function (answered) {
                        if (!answered.ok) {
                            throw new Error(String(answered.status));
                        }

                        return answered.json();
                    });
                }

                /*
                 * The one call this page makes that changes anything. It sends no identifier: whose
                 * setting is being changed is read off the credential by the endpoint, which is what
                 * makes it impossible for this page, or for anything else, to change somebody else's.
                 */
                function sent(endpoint, body) {
                    return fetch(address(endpoint), {
                        method: "POST",
                        headers: { Accept: "application/json", "Content-Type": "application/json" },
                        body: JSON.stringify(body),
                    }).then(function (answered) {
                        if (!answered.ok) {
                            throw new Error(String(answered.status));
                        }

                        return answered.json();
                    });
                }

                /*
                 * One cell, with the string put in as a string. A title and a note are things a
                 * person typed, and a page that turned either into markup would be a scripting hole
                 * reachable by anybody who can file a request.
                 */
                function cell(row, text) {
                    var target = document.createElement("td");
                    target.textContent = text;
                    row.appendChild(target);
                    return target;
                }

                function moment(value) {
                    return value ? new Date(value).toLocaleString() : "";
                }

                function title(request) {
                    var written = request.DisplayTitle;

                    if (request.DisplayYear) {
                        written = say("title.withYear", [written, request.DisplayYear]);
                    }

                    if (request.Seasons && request.Seasons.length) {
                        written = say("title.withSeasons", [written, request.Seasons.join(", ")]);
                    }

                    return written;
                }

                /*
                 * A value the endpoint answered with, as a word. A value this page has no key for
                 * is shown as it came rather than dropped, so a state added to the model appears
                 * here as its own name instead of as a blank cell.
                 */
                function named(group, value) {
                    return word(group + "." + value) || value;
                }

                function held(request) {
                    return named("availability", request.Availability);
                }

                /*
                 * What happens next, as a sentence rather than as the state name in the column
                 * before it. Two of the three outcomes #70 names are states a row can be in, and a
                 * person who reads only `Waiting for an answer` is the person who asks the operator
                 * what that means. The third, being at one's quota, is met while asking rather than
                 * while reading, so it has no row here and reaches a person through the answer the
                 * API gives whoever asked on their behalf.
                 *
                 * A state with no sentence gets an empty cell rather than an invented one. A state
                 * added to the model therefore reads as a row with nothing in this column, which is
                 * the honest rendering: nothing here knows what happens next for a state nobody has
                 * written a sentence for.
                 */
                function next(request) {
                    if (request.State === "Open") {
                        return word("outcome.waiting");
                    }

                    if (request.State === "Declined") {
                        return word("outcome.declined");
                    }

                    return "";
                }

                /*
                 * Why the answer was no, where it was. The reason is one of a fixed set and the
                 * sentence beside it is what the operator wrote for this person to read, which is
                 * the one piece of somebody else's writing this page shows at all.
                 */
                function why(request) {
                    if (!request.DeclineReason) {
                        return "";
                    }

                    var reason = named("declineReason", request.DeclineReason);

                    return request.DeclineNote ? say("declineReason.withNote", [reason, request.DeclineNote]) : reason;
                }

                function draw(answer) {
                    var drawn = document.createDocumentFragment();

                    answer.Requests.forEach(function (request) {
                        var row = document.createElement("tr");

                        cell(row, title(request));
                        cell(row, named("kind", request.Kind));
                        cell(row, named("mine.state", request.State));
                        cell(row, next(request));
                        cell(row, moment(request.RequestedAt));
                        cell(row, moment(request.StateChangedAt));
                        cell(row, held(request));
                        cell(row, request.YourNote || "");
                        cell(row, why(request));

                        drawn.appendChild(row);
                    });

                    rows.replaceChildren(drawn);

                    if (answer.MatchCount === 0) {
                        summary.textContent = word("mine.empty");
                        return;
                    }

                    summary.textContent = answer.Requests.length === answer.MatchCount ? say("mine.countAll", [answer.MatchCount]) : say("mine.countSome", [answer.Requests.length, answer.MatchCount]);
                }

                function tell(key) {
                    message.textContent = key ? word(key) : "";
                }

                /*
                 * Every element that names a key gets the word under it. Attributes are not walked
                 * here because nothing on this page carries a translatable one: the label on the
                 * one control is an element of its own rather than an attribute, exactly so that it
                 * arrives through this walk like every other word.
                 */
                function fill() {
                    document.querySelectorAll("[data-i18n]").forEach(function (element) {
                        element.textContent = word(element.getAttribute("data-i18n"));
                    });
                }

                /*
                 * The culture the browser is set to, handed to the endpoint rather than left to the
                 * request headers. A page opened with a credential in its address is opened in
                 * whatever the person's browser is, and `navigator.language` is what that browser
                 * says; the endpoint falls back to Accept-Language and then to English, so a
                 * browser that answers with nothing loses nothing.
                 */
                function culture() {
                    return window.navigator && window.navigator.language ? { culture: window.navigator.language } : {};
                }

                /*
                 * The switch, once the endpoint has said which way it is set. It is shown only
                 * after that answer, because a checkbox drawn before it is a control claiming a
                 * state nobody has read, and the state it would claim is the one somebody would
                 * least want claimed for them.
                 *
                 * A change that the endpoint refuses puts the box back where it was. Leaving it
                 * where the person clicked would show them a setting the server does not hold, and
                 * the next thing they would notice is a message they thought they had turned off.
                 */
                function showNotices(setting) {
                    noticesBox.checked = Boolean(setting.TellsMe);
                    notices.hidden = false;
                }

                function changeNotices() {
                    var wanted = noticesBox.checked;

                    noticesBox.disabled = true;

                    return sent("Notices/Mine", { TellsMe: wanted })
                        .then(function (setting) {
                            noticesBox.checked = Boolean(setting.TellsMe);
                            tell("");
                        })
                        .catch(function () {
                            noticesBox.checked = !wanted;
                            tell("mine.notices.notSaved");
                        })
                        .then(function () {
                            noticesBox.disabled = false;
                        });
                }

                function read() {
                    return fetched("Strings", culture())
                        .then(function (answer) {
                            words = answer.Strings || {};
                            fill();

                            return fetched("Requests", { take: most });
                        })
                        .then(function (answer) {
                            tell("");
                            draw(answer);

                            /*
                             * After the rows and never instead of them. The setting is a courtesy
                             * about a courtesy, and a page that could not read it is still the page
                             * that answers what somebody came here for, so this failure leaves the
                             * requests drawn and takes the control away rather than the list.
                             */
                            return fetched("Notices/Mine")
                                .then(showNotices)
                                .catch(function () {
                                    notices.hidden = true;
                                });
                        })
                        .catch(function () {
                            tell("mine.notRead");
                        });
                }

                noticesBox.addEventListener("change", changeNotices);

                read();
            })();
        </script>
    </body>
</html>
