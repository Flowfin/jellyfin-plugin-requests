<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title data-i18n="queue.title"></title>
    </head>
    <body>
        <div id="RequestsQueuePage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-button,emby-select">
            <div data-role="content">
                <div class="content-primary">
                    <div class="requestsShell"></div>

                    <h2 data-i18n="queue.heading"></h2>

                    <p class="requestsMessage" role="status"></p>

                    <!--
                        Every narrowing here is a parameter of the queue endpoint and none of it is
                        done in this page. The server holds the whole queue, so it is the only side
                        that can filter, order and slice one read; a page that fetched everything and
                        did the same work again would be asking a household server to send a decade
                        of requests so that a browser could throw away all but fifty of them.

                        What the rows show is the list in docs/queue.md, less the two items that
                        document names as absent from the answer this endpoint gives. Acting on
                        several rows at once is #62, and the panel beside the queue is #63.
                    -->
                    <div class="requestsQueueControls">
                        <label class="requestsQueueControl" for="RequestsQueueState">
                            <span data-i18n="queue.control.state"></span>
                            <select is="emby-select" id="RequestsQueueState">
                                <option value="Open" selected data-i18n="queue.state.Open"></option>
                                <option value="Approved" data-i18n="queue.state.Approved"></option>
                                <option value="Declined" data-i18n="queue.state.Declined"></option>
                                <option value="Fulfilled" data-i18n="queue.state.Fulfilled"></option>
                                <option value="Failed" data-i18n="queue.state.Failed"></option>
                                <option value="" data-i18n="queue.state.every"></option>
                            </select>
                        </label>

                        <label class="requestsQueueControl" for="RequestsQueueKind">
                            <span data-i18n="queue.control.kind"></span>
                            <select is="emby-select" id="RequestsQueueKind">
                                <option value="" selected data-i18n="queue.kind.every"></option>
                                <option value="Movie" data-i18n="kind.Movie"></option>
                                <option value="Series" data-i18n="kind.Series"></option>
                            </select>
                        </label>

                        <label class="requestsQueueControl" for="RequestsQueueOrder">
                            <span data-i18n="queue.control.order"></span>
                            <select is="emby-select" id="RequestsQueueOrder">
                                <option value="RequestedAt" selected data-i18n="queue.order.RequestedAt"></option>
                                <option value="StateChangedAt" data-i18n="queue.order.StateChangedAt"></option>
                                <option value="DisplayTitle" data-i18n="queue.order.DisplayTitle"></option>
                            </select>
                        </label>

                        <label class="requestsQueueControl" for="RequestsQueueDescending">
                            <span data-i18n="queue.control.descending"></span>
                            <!--
                                Ascending and descending rather than oldest and newest, because the
                                same control also runs the title order and "oldest title" is not a
                                thing. Ascending on the order above it is the oldest first, which is
                                what this page opens on.
                            -->
                            <select is="emby-select" id="RequestsQueueDescending">
                                <option value="false" selected data-i18n="queue.direction.ascending"></option>
                                <option value="true" data-i18n="queue.direction.descending"></option>
                            </select>
                        </label>
                    </div>

                    <!--
                        Where a decline says why, open only while one is being made. It is a strip on
                        the page rather than a dialog because a dialog is the dashboard's own
                        component and a plugin page that builds one of its own is a second dialog
                        that stops matching the server the day the server's changes.

                        The reason is required and the endpoint refuses a decline without one, so
                        this collects it before anything is sent rather than sending and reporting a
                        refusal an operator could have been spared. The list opens on a value that
                        chooses nothing, so a decline never carries a reason nobody picked.

                        Each option carries the name the model gives that reason rather than its
                        number, which is what the state filter above already does. A number here
                        would be a second spelling of the same list, readable by nobody, and it
                        would go on parsing after somebody reordered the enumeration.
                    -->
                    <div class="requestsQueueDecline" hidden>
                        <p class="requestsQueueDeclineTitle"></p>

                        <div class="requestsQueueControls">
                            <label class="requestsQueueControl" for="RequestsQueueDeclineReason">
                                <span data-i18n="queue.decline.reason"></span>
                                <select is="emby-select" id="RequestsQueueDeclineReason">
                                    <option value="" selected data-i18n="queue.decline.choose"></option>
                                    <option value="AlreadyInTheLibrary" data-i18n="declineReason.AlreadyInTheLibrary"></option>
                                    <option value="AlreadyRequested" data-i18n="declineReason.AlreadyRequested"></option>
                                    <option value="CannotBeObtained" data-i18n="declineReason.CannotBeObtained"></option>
                                    <option value="NoRoomForIt" data-i18n="declineReason.NoRoomForIt"></option>
                                    <option value="NotWanted" data-i18n="declineReason.NotWanted"></option>
                                    <option value="Other" data-i18n="declineReason.Other"></option>
                                </select>
                            </label>

                            <label class="requestsQueueControl" for="RequestsQueueDeclineNote">
                                <span data-i18n="queue.decline.note"></span>
                                <textarea id="RequestsQueueDeclineNote" rows="2"></textarea>
                            </label>

                            <button is="emby-button" type="button" class="raised" id="RequestsQueueDeclineSend" data-i18n="queue.decline.send"></button>
                            <button is="emby-button" type="button" class="raised" id="RequestsQueueDeclineCancel" data-i18n="queue.decline.cancel"></button>
                        </div>
                    </div>

                    <table class="requestsQueueTable">
                        <caption class="requestsQueueSummary" aria-live="polite"></caption>
                        <thead>
                            <tr>
                                <th scope="col" data-i18n="queue.column.title"></th>
                                <th scope="col" data-i18n="queue.column.kind"></th>
                                <th scope="col" data-i18n="queue.column.state"></th>
                                <th scope="col" data-i18n="queue.column.requestedAt"></th>
                                <th scope="col" data-i18n="queue.column.stateChangedAt"></th>
                                <th scope="col" data-i18n="queue.column.requester"></th>
                                <th scope="col" data-i18n="queue.column.availability"></th>
                                <th scope="col" data-i18n="queue.column.note"></th>
                                <th scope="col" data-i18n="queue.column.decision"></th>
                                <th scope="col" data-i18n="queue.column.decide"></th>
                            </tr>
                        </thead>
                        <tbody class="requestsQueueRows"></tbody>
                    </table>

                    <div class="requestsQueuePager">
                        <button is="emby-button" type="button" class="raised" id="RequestsQueuePrevious" data-i18n="queue.previous"></button>
                        <button is="emby-button" type="button" class="raised" id="RequestsQueueNext" data-i18n="queue.next"></button>
                    </div>
                </div>
            </div>

            <script type="text/javascript">
                (function () {
                    var page = document.querySelector("#RequestsQueuePage");

                    /*
                     * Every part of the question this page asks, named exactly as the queue endpoint
                     * names it. The four with a control are read from that control; the two without
                     * are the bounds below. Anything the endpoint does not declare cannot be added
                     * here without the suite naming it, which is what keeps a control that quietly
                     * does its own work out of this page.
                     */
                    var asked = ["state", "kind", "order", "descending", "skip", "take"];

                    /*
                     * Where the page starts and how many rows it holds. Fifty is the endpoint's own
                     * page size, so the browser is handed one screen of a queue whatever the queue
                     * holds, and the pager moves this rather than growing it.
                     */
                    var bounds = { skip: 0, take: 50 };

                    /*
                     * Which decisions a row admits, by the state it is in. It is the cells of the
                     * transition table an administrator may make, and it is a second copy of a rule
                     * the model already holds, because the answer this page draws carries a request's
                     * state and not the moves that are open on it.
                     *
                     * A second copy is what drifts, so EveryDecisionAnOperatorMayMakeIsOfferedByTheQueue
                     * reads this object and compares it against RequestLifecycle's own table. A cell
                     * that opens or closes in the model reds the suite here rather than leaving an
                     * operator with a button the server refuses or a move nobody can make.
                     *
                     * Fulfilled carries an empty list rather than being left out: the end of the life
                     * of a request is a state with no decisions in it, and saying so here is what
                     * separates it from a state somebody forgot.
                     */
                    var decisions = {
                        Open: ["Approve", "Decline"],
                        Approved: ["Decline"],
                        Declined: ["Approve"],
                        Fulfilled: [],
                        Failed: ["Approve", "Decline"],
                    };

                    /*
                     * The two decisions themselves. Each key is the last segment of the endpoint that
                     * makes it, so the path a button posts to is built from the same word the table
                     * above names it by rather than from a second list.
                     *
                     * The label is the word on the button and the name is what a screen reader
                     * announces, which carries the title as well: a column of buttons all saying
                     * `Approve` tells somebody who cannot see the row nothing about which row they
                     * are on.
                     *
                     * An approval is sent from the button and a decline goes through the strip
                     * above, because one of the two carries something an operator has to say first.
                     */
                    var moves = {
                        Approve: {
                            label: "queue.decide.approve",
                            name: function (written) {
                                return RequestsShell.fill("queue.decide.approveNamed", [written]);
                            },
                            act: function (request) {
                                send(request, "Approve", { Revision: request.Revision });
                            },
                        },
                        Decline: {
                            label: "queue.decide.decline",
                            name: function (written) {
                                return RequestsShell.fill("queue.decide.declineNamed", [written]);
                            },
                            act: function (request) {
                                collect(request);
                            },
                        },
                    };

                    var rows = page.querySelector(".requestsQueueRows");
                    var summary = page.querySelector(".requestsQueueSummary");
                    var previous = page.querySelector("#RequestsQueuePrevious");
                    var next = page.querySelector("#RequestsQueueNext");

                    var declineForm = page.querySelector(".requestsQueueDecline");
                    var declineTitle = page.querySelector(".requestsQueueDeclineTitle");
                    var declineReason = control("declineReason");
                    var declineNote = control("declineNote");
                    var declineSend = control("declineSend");
                    var declineCancel = control("declineCancel");

                    /*
                     * The answer the rows on the screen were drawn from, and the request a reason is
                     * being collected for. Both are the page's own memory of what an operator is
                     * looking at, which is what a decision puts back rather than replacing.
                     */
                    var showing = null;
                    var declining = null;

                    /*
                     * Every word this page draws comes from the catalogue the shell fetched, keyed
                     * by the value the endpoint answered with. There is no map of values to words
                     * here and there was one until #73: a map in a page is a second catalogue that
                     * no language file can reach, and it is the reason `Not checked` and
                     * `Already in the library` stayed English however much else was translated.
                     *
                     * A value no key exists for is shown as it came rather than dropped, so a state
                     * added to the model appears as its own name instead of as a blank cell. That
                     * is RequestsShell.named, and it is shared with the page a person opens in a
                     * browser rather than written twice.
                     */

                    // Loaded through the same endpoint the dashboard fetches this page from, because
                    // an embedded resource is reachable only under a name the plugin registered.
                    function shell() {
                        if (window.RequestsShell) {
                            return Promise.resolve();
                        }

                        return new Promise(function (resolve, reject) {
                            var script = document.createElement("script");
                            script.src = ApiClient.getUrl("web/ConfigurationPage", { name: "Requests.js" });
                            script.onload = resolve;
                            script.onerror = function () {
                                reject(new Error("The shared script for this plugin's pages could not be loaded."));
                            };
                            document.head.appendChild(script);
                        });
                    }

                    /*
                     * The control that answers one part of the question, or nothing where that part
                     * is the page bounds rather than something an operator chose.
                     */
                    function control(name) {
                        return page.querySelector("#RequestsQueue" + name.charAt(0).toUpperCase() + name.substring(1));
                    }

                    /*
                     * The question, as the endpoint's own parameters. An empty control is left out
                     * rather than sent empty, because a filter naming no value is the queue not
                     * narrowed and the endpoint reads an absent parameter as exactly that.
                     */
                    function question() {
                        var sent = {};

                        asked.forEach(function (name) {
                            var from = control(name);
                            var value = from ? from.value : String(bounds[name]);

                            if (value !== "") {
                                sent[name] = value;
                            }
                        });

                        return sent;
                    }

                    /*
                     * One cell. `textContent` rather than any of the ways of writing markup: a title
                     * and a note are things a person typed, and a dashboard that renders them as
                     * markup is a scripting hole reachable by anybody who can file a request.
                     */
                    function cell(row, text) {
                        var target = document.createElement("td");
                        target.textContent = text;
                        row.appendChild(target);
                        return target;
                    }

                    function moment(value) {
                        return value ? new Date(value).toLocaleString() : "";
                    }

                    function title(request) {
                        var written = request.DisplayTitle;

                        if (request.DisplayYear) {
                            written = RequestsShell.fill("title.withYear", [written, request.DisplayYear]);
                        }

                        if (request.Seasons && request.Seasons.length) {
                            written = RequestsShell.fill("title.withSeasons", [written, request.Seasons.join(", ")]);
                        }

                        return written;
                    }

                    function held(request) {
                        var answer = RequestsShell.named("availability", request.Availability);

                        return request.AvailabilityCheckedAt ? RequestsShell.fill("queue.availabilityChecked", [answer, moment(request.AvailabilityCheckedAt)]) : answer;
                    }

                    /*
                     * What was decided, where anything was. The reason is one of a fixed set and the
                     * note beside it is an operator's own sentence, which is the second of the two
                     * pieces of writing on this page that a person typed.
                     */
                    function decided(request) {
                        if (!request.DeclineReason) {
                            return "";
                        }

                        var reason = RequestsShell.named("declineReason", request.DeclineReason);

                        return request.DeclineNote ? RequestsShell.fill("declineReason.withNote", [reason, request.DeclineNote]) : reason;
                    }

                    /*
                     * The decisions open on one row, as buttons.
                     *
                     * A real button rather than a styled element with a click handler on it: the
                     * second is a control the keyboard never reaches, and it looks identical to one
                     * that works. The dashboard's own button is asked for by name, and a browser
                     * that does not build customised elements gets an ordinary button, which is the
                     * same control with the server's styling missing rather than a broken one.
                     */
                    function decide(row, request) {
                        var target = document.createElement("td");
                        var written = title(request);
                        var open = decisions[request.State] || [];

                        target.className = "requestsQueueDecide";

                        open.forEach(function (move) {
                            var button = document.createElement("button", { is: "emby-button" });

                            button.type = "button";
                            button.className = "raised";
                            button.textContent = RequestsShell.word(moves[move].label);
                            button.setAttribute("aria-label", moves[move].name(written));
                            button.addEventListener("click", function () {
                                moves[move].act(request);
                            });

                            target.appendChild(button);
                        });

                        row.appendChild(target);
                    }

                    /*
                     * One request, put back into the answer on the screen and drawn where it already
                     * was.
                     *
                     * Reading the queue again instead would move the operator: a row that no longer
                     * matches the filter it was read under takes every row under it up one line, and
                     * the next thing clicked is not the thing that was aimed at. So a decision
                     * changes one row and leaves the filter, the order and the page where they were.
                     */
                    function replace(request) {
                        if (!showing) {
                            return;
                        }

                        for (var at = 0; at < showing.Requests.length; at++) {
                            if (showing.Requests[at].Id === request.Id) {
                                showing.Requests[at] = request;
                            }
                        }

                        draw(showing);
                    }

                    /*
                     * A decision, with the revision the operator was looking at.
                     *
                     * The revision is what makes two operators with the queue open safe: a request
                     * that moved since this page drew it is refused rather than decided over
                     * somebody else's decision, and the refusal carries what the queue holds now.
                     *
                     * It answers whether the decision was taken, which is what the strip above reads
                     * to decide whether to close: a decline the server refused leaves the reason and
                     * the words the operator typed where they are, so the repair is adding what was
                     * missing rather than typing it all again.
                     */
                    function send(request, move, body) {
                        Dashboard.showLoadingMsg();

                        return RequestsShell.post("Requests/" + request.Id + "/" + move, body)
                            .then(function (answer) {
                                RequestsShell.say(page, "");
                                replace(answer);
                                Dashboard.hideLoadingMsg();
                                return true;
                            })
                            .catch(function (refusal) {
                                Dashboard.hideLoadingMsg();
                                return refused(request, move, refusal);
                            });
                    }

                    /*
                     * A refused decision, as the operator meets it: what they tried to do, what the
                     * server said, and the row put back as the store holds it now.
                     *
                     * The refusal carries that row itself on every code about a request that is
                     * there, which is what makes "somebody else approved it a moment ago" readable
                     * without opening the queue again. A rejection this page cannot read a body out
                     * of is said as that rather than dressed up as a refusal with a reason.
                     */
                    function refused(request, move, refusal) {
                        var carried = refusal && typeof refusal.json === "function" ? refusal.json() : Promise.resolve(null);
                        var tried = moves[move].name(title(request));

                        return carried
                            .catch(function () {
                                return null;
                            })
                            .then(function (failure) {
                                if (failure && failure.Current) {
                                    replace(failure.Current);
                                }

                                if (failure && failure.Message) {
                                    RequestsShell.say(page, "queue.decisionRefused", [tried, failure.Message]);
                                    return false;
                                }

                                RequestsShell.say(page, "queue.decisionNotSent", [tried]);

                                return false;
                            });
                    }

                    /*
                     * Collecting the reason a decline carries, before anything is sent. A decline
                     * with no reason reads as arbitrariness to the person who asked, and what they
                     * do next is ask for the same title again.
                     */
                    function collect(request) {
                        declining = request;
                        declineReason.value = "";
                        declineNote.value = "";
                        declineTitle.textContent = RequestsShell.fill("queue.decline.heading", [title(request)]);
                        declineForm.hidden = false;
                        declineReason.focus();
                    }

                    function stop() {
                        declining = null;
                        declineForm.hidden = true;
                    }

                    /*
                     * The decline, once the operator has said why.
                     *
                     * The one thing checked here is that a reason was chosen, because the list opens
                     * on nothing and sending that would spend a call to be told what this page
                     * already knows. Everything else a decline has to satisfy stays the model's:
                     * that the reason which says nothing on its own needs a sentence beside it is
                     * one rule in one place, and what an operator meets when they miss it is the
                     * server's own words rather than a second copy of them that drifts.
                     */
                    function decline() {
                        if (!declining) {
                            return;
                        }

                        if (declineReason.value === "") {
                            RequestsShell.say(page, "queue.decline.needsReason");
                            return;
                        }

                        var request = declining;

                        send(request, "Decline", {
                            Revision: request.Revision,
                            Reason: declineReason.value,
                            Note: declineNote.value,
                        }).then(function (decided) {
                            if (decided) {
                                stop();
                            }
                        });
                    }

                    function draw(answer) {
                        var drawn = document.createDocumentFragment();

                        showing = answer;

                        answer.Requests.forEach(function (request) {
                            var row = document.createElement("tr");

                            cell(row, title(request));
                            cell(row, RequestsShell.named("kind", request.Kind));
                            cell(row, RequestsShell.named("queue.state", request.State));
                            cell(row, moment(request.RequestedAt));
                            cell(row, moment(request.StateChangedAt));
                            cell(row, request.RequestedByUserId);
                            cell(row, held(request));
                            cell(row, request.RequesterNote || "");
                            cell(row, decided(request));
                            decide(row, request);

                            drawn.appendChild(row);
                        });

                        rows.replaceChildren(drawn);

                        var first = answer.MatchCount === 0 ? 0 : answer.Skip + 1;
                        var last = answer.Skip + answer.Requests.length;

                        summary.textContent = RequestsShell.fill("queue.summary", [first, last, answer.MatchCount]);

                        previous.disabled = answer.Skip <= 0;
                        next.disabled = last >= answer.MatchCount;
                    }

                    function read() {
                        Dashboard.showLoadingMsg();
                        RequestsShell.say(page, "");

                        return RequestsShell.get("Requests/Queue", question())
                            .then(function (answer) {
                                draw(answer);
                                Dashboard.hideLoadingMsg();
                            })
                            .catch(function () {
                                RequestsShell.say(page, "queue.notRead");
                                Dashboard.hideLoadingMsg();
                            });
                    }

                    /*
                     * A narrowing starts the queue again from the top. Keeping the offset across a
                     * change of filter is how an operator lands on an empty page and reads it as an
                     * empty queue.
                     */
                    function narrowed() {
                        bounds.skip = 0;
                        read();
                    }

                    function step(by) {
                        bounds.skip = Math.max(0, bounds.skip + by * bounds.take);
                        read();
                    }

                    asked.forEach(function (name) {
                        var from = control(name);

                        if (from) {
                            from.addEventListener("change", narrowed);
                        }
                    });

                    declineSend.addEventListener("click", decline);
                    declineCancel.addEventListener("click", stop);

                    previous.addEventListener("click", function () {
                        step(-1);
                    });

                    next.addEventListener("click", function () {
                        step(1);
                    });

                    page.addEventListener("pageshow", function () {
                        Dashboard.showLoadingMsg();

                        shell()
                            .then(function () {
                                return RequestsShell.load();
                            })
                            .then(function () {
                                RequestsShell.attach(page, "RequestsQueue");
                                RequestsShell.draw(page);
                                Dashboard.hideLoadingMsg();
                                read();
                            })
                            .catch(function () {
                                Dashboard.hideLoadingMsg();
                            });
                    });
                })();
            </script>
        </div>
    </body>
</html>
