<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title data-i18n="config.title"></title>
    </head>
    <body>
        <div id="RequestsConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-select,emby-checkbox,emby-textarea">
            <div data-role="content">
                <div class="content-primary">
                    <div class="requestsShell"></div>

                    <h2 data-i18n="config.heading"></h2>

                    <p class="requestsMessage" role="status"></p>

                    <form id="RequestsConfigForm">
                        <div class="inputContainer">
                            <label class="inputLabel inputLabelUnfocused" for="RequestsOpenRequestsPerUser" data-i18n="config.openRequestsPerUser.label"></label>
                            <input is="emby-input" type="number" id="RequestsOpenRequestsPerUser" min="1" step="1" required />
                            <div class="fieldDescription" data-i18n="config.openRequestsPerUser.description"></div>
                        </div>

                        <div class="checkboxContainer checkboxContainer-withDescription">
                            <label>
                                <input is="emby-checkbox" type="checkbox" id="RequestsAcceptsMovies" />
                                <span data-i18n="config.acceptsMovies.label"></span>
                            </label>
                            <div class="fieldDescription checkboxFieldDescription" data-i18n="config.acceptsKinds.description"></div>
                        </div>

                        <div class="checkboxContainer checkboxContainer-withDescription">
                            <label>
                                <input is="emby-checkbox" type="checkbox" id="RequestsAcceptsSeries" />
                                <span data-i18n="config.acceptsSeries.label"></span>
                            </label>
                        </div>

                        <div class="inputContainer">
                            <label class="inputLabel inputLabelUnfocused" for="RequestsFinishedRequestRetentionDays" data-i18n="config.retention.label"></label>
                            <input is="emby-input" type="number" id="RequestsFinishedRequestRetentionDays" min="30" step="1" required />
                            <div class="fieldDescription" data-i18n="config.retention.description"></div>
                        </div>

                        <div class="inputContainer">
                            <label class="inputLabel inputLabelUnfocused" for="RequestsOutboundNoticeAddressEntry" data-i18n="config.outboundNoticeAddress.label"></label>
                            <input is="emby-input" type="url" id="RequestsOutboundNoticeAddressEntry" autocomplete="off" />
                            <div class="fieldDescription" id="RequestsOutboundNoticeAddressState"></div>
                            <div class="fieldDescription" data-i18n="config.outboundNoticeAddress.description"></div>
                        </div>

                        <div class="checkboxContainer checkboxContainer-withDescription">
                            <label>
                                <input is="emby-checkbox" type="checkbox" id="RequestsOutboundNoticeAddressRemove" />
                                <span data-i18n="config.outboundNoticeAddress.remove.label"></span>
                            </label>
                            <div class="fieldDescription checkboxFieldDescription" data-i18n="config.outboundNoticeAddress.remove.description"></div>
                        </div>

                        <div class="checkboxContainer checkboxContainer-withDescription">
                            <label>
                                <input is="emby-checkbox" type="checkbox" id="RequestsTellsAdministratorsAboutArrivals" />
                                <span data-i18n="config.tellsAdministratorsAboutArrivals.label"></span>
                            </label>
                            <div class="fieldDescription checkboxFieldDescription" data-i18n="config.tellsAdministratorsAboutArrivals.description"></div>
                        </div>

                        <div class="checkboxContainer checkboxContainer-withDescription">
                            <label>
                                <input is="emby-checkbox" type="checkbox" id="RequestsAnnouncesApprovals" />
                                <span data-i18n="config.announcesApprovals.label"></span>
                            </label>
                            <div class="fieldDescription checkboxFieldDescription" data-i18n="config.announce.description"></div>
                        </div>

                        <div class="checkboxContainer checkboxContainer-withDescription">
                            <label>
                                <input is="emby-checkbox" type="checkbox" id="RequestsAnnouncesDeclines" />
                                <span data-i18n="config.announcesDeclines.label"></span>
                            </label>
                        </div>

                        <div class="checkboxContainer checkboxContainer-withDescription">
                            <label>
                                <input is="emby-checkbox" type="checkbox" id="RequestsAnnouncesFulfilments" />
                                <span data-i18n="config.announcesFulfilments.label"></span>
                            </label>
                        </div>

                        <h3 data-i18n="config.bridge.heading"></h3>

                        <p class="fieldDescription" data-i18n="config.bridge.description"></p>

                        <div class="inputContainer">
                            <label class="inputLabel inputLabelUnfocused" for="RequestsBridgeAddress" data-i18n="config.bridgeAddress.label"></label>
                            <input is="emby-input" type="url" id="RequestsBridgeAddress" autocomplete="off" />
                            <div class="fieldDescription" data-i18n="config.bridgeAddress.description"></div>
                        </div>

                        <div class="inputContainer">
                            <label class="inputLabel inputLabelUnfocused" for="RequestsBridgeApiKeyEntry" data-i18n="config.bridgeApiKey.label"></label>
                            <input is="emby-input" type="password" id="RequestsBridgeApiKeyEntry" autocomplete="off" />
                            <div class="fieldDescription" id="RequestsBridgeApiKeyState"></div>
                            <div class="fieldDescription" data-i18n="config.bridgeApiKey.description"></div>
                        </div>

                        <div class="checkboxContainer checkboxContainer-withDescription">
                            <label>
                                <input is="emby-checkbox" type="checkbox" id="RequestsBridgeApiKeyRemove" />
                                <span data-i18n="config.bridgeApiKey.remove.label"></span>
                            </label>
                            <div class="fieldDescription checkboxFieldDescription" data-i18n="config.bridgeApiKey.remove.description"></div>
                        </div>

                        <div class="inputContainer">
                            <label class="inputLabel inputLabelUnfocused" for="RequestsBridgeAccounts" data-i18n="config.bridgeAccounts.label"></label>
                            <textarea is="emby-textarea" id="RequestsBridgeAccounts" rows="4" autocomplete="off" spellcheck="false"></textarea>
                            <div class="fieldDescription" data-i18n="config.bridgeAccounts.description"></div>
                        </div>

                        <div>
                            <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                                <span data-i18n="config.save"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <script type="text/javascript">
                var RequestsConfig = {
                    pluginUniqueId: "0f9c9107-b31b-459e-81fa-6d35dac25e79",
                };

                (function () {
                    var page = document.querySelector("#RequestsConfigPage");

                    // The shared script is fetched through the same endpoint the dashboard fetches
                    // this page from, because an embedded resource is reachable only under a name
                    // the plugin registered.
                    function shell() {
                        if (window.RequestsShell) {
                            return Promise.resolve();
                        }

                        return new Promise(function (resolve, reject) {
                            var script = document.createElement("script");
                            script.src = ApiClient.getUrl("web/ConfigurationPage", { name: "Requests.js" });
                            script.onload = resolve;
                            script.onerror = function () {
                                reject(new Error("The shared script for this plugin's pages could not be loaded."));
                            };
                            document.head.appendChild(script);
                        });
                    }

                    // One place names a setting and the field it is edited in. A second list would
                    // be the thing that goes stale when a setting is added, and the setting would
                    // then be one the page cannot reach while the page still looks complete.
                    var numbers = {
                        OpenRequestsPerUser: "#RequestsOpenRequestsPerUser",
                        FinishedRequestRetentionDays: "#RequestsFinishedRequestRetentionDays",
                    };

                    var switches = {
                        AcceptsMovies: "#RequestsAcceptsMovies",
                        AcceptsSeries: "#RequestsAcceptsSeries",
                        AnnouncesApprovals: "#RequestsAnnouncesApprovals",
                        AnnouncesDeclines: "#RequestsAnnouncesDeclines",
                        AnnouncesFulfilments: "#RequestsAnnouncesFulfilments",
                        TellsAdministratorsAboutArrivals: "#RequestsTellsAdministratorsAboutArrivals",
                    };

                    // The outbound address is write-only on this page, decided on #113 as the
                    // answer to #100. It is never put into an element: what is drawn is whether
                    // one is set, the entry box is empty on every load, and the stored value is
                    // replaced only by an address somebody typed here.
                    //
                    // What that costs, stated rather than implied: an operator can no longer read
                    // back the address this install is set to, only whether there is one. The
                    // price is accepted because the box's other behaviour was worse - a value the
                    // page fetched sits in the markup of an administrator's screen, in whatever
                    // they photograph of it, and is sent back on every save made for any other
                    // setting.
                    //
                    // What it does NOT do, because no page can: the server serves this plugin's
                    // whole configuration on its own endpoint, which is where this page fetches
                    // it from, so the address still leaves the server to anybody who may read that
                    // endpoint. `docs/configuration.md` carries that bound.
                    var entry = "#RequestsOutboundNoticeAddressEntry";
                    var removal = "#RequestsOutboundNoticeAddressRemove";
                    var state = "#RequestsOutboundNoticeAddressState";

                    // The bridge address is text an operator has to be able to read back: it is the
                    // name of the machine their server is pointed at and carries no credential,
                    // which `docs/bridge.md` decides. The credential beside it is write-only, the
                    // same shape as the outbound address and for the same reason.
                    var texts = {
                        BridgeAddress: "#RequestsBridgeAddress",
                    };

                    var keyEntry = "#RequestsBridgeApiKeyEntry";
                    var keyRemoval = "#RequestsBridgeApiKeyRemove";
                    var keyState = "#RequestsBridgeApiKeyState";

                    // The account mapping is a table drawn as text, one row per line: the person's
                    // user identifier on this server, a space, and the number the external service
                    // knows them by. A line an operator removes is a person left unmapped, and the
                    // server refuses a line it cannot honour rather than saving a corrected one.
                    var tables = {
                        BridgeAccounts: "#RequestsBridgeAccounts",
                    };

                    function rowsToText(rows) {
                        return (rows || [])
                            .map(function (row) {
                                return row.UserId + " " + row.Account;
                            })
                            .join("\n");
                    }

                    function textToRows(text) {
                        return text
                            .split("\n")
                            .map(function (line) {
                                return line.trim();
                            })
                            .filter(function (line) {
                                return line.length > 0;
                            })
                            .map(function (line) {
                                var split = line.search(/\s/);
                                // A line with no space is a row with no account on it, which the
                                // server names as such rather than this page guessing at a value.
                                return split < 0 ? { UserId: line, Account: "" } : { UserId: line.slice(0, split), Account: line.slice(split).trim() };
                            });
                    }

                    function show(config) {
                        Object.keys(numbers).forEach(function (setting) {
                            page.querySelector(numbers[setting]).value = config[setting];
                        });

                        Object.keys(switches).forEach(function (setting) {
                            page.querySelector(switches[setting]).checked = config[setting];
                        });

                        Object.keys(texts).forEach(function (setting) {
                            page.querySelector(texts[setting]).value = config[setting] || "";
                        });

                        Object.keys(tables).forEach(function (setting) {
                            page.querySelector(tables[setting]).value = rowsToText(config[setting]);
                        });

                        // Presence, never the value. An empty entry box on every load is what
                        // makes "sent only when newly entered" readable to somebody using the
                        // page: there is nothing in it to leave alone by accident.
                        page.querySelector(entry).value = "";
                        page.querySelector(removal).checked = false;
                        page.querySelector(state).textContent = config.OutboundNoticeAddress ? RequestsShell.word("config.outboundNoticeAddress.set") : RequestsShell.word("config.outboundNoticeAddress.notSet");

                        page.querySelector(keyEntry).value = "";
                        page.querySelector(keyRemoval).checked = false;
                        page.querySelector(keyState).textContent = config.BridgeApiKey ? RequestsShell.word("config.bridgeApiKey.set") : RequestsShell.word("config.bridgeApiKey.notSet");
                    }

                    function read(config) {
                        Object.keys(numbers).forEach(function (setting) {
                            config[setting] = parseInt(page.querySelector(numbers[setting]).value, 10);
                        });

                        Object.keys(switches).forEach(function (setting) {
                            config[setting] = page.querySelector(switches[setting]).checked;
                        });

                        Object.keys(texts).forEach(function (setting) {
                            config[setting] = page.querySelector(texts[setting]).value.trim();
                        });

                        Object.keys(tables).forEach(function (setting) {
                            config[setting] = textToRows(page.querySelector(tables[setting]).value);
                        });

                        // Three cases and they are ordered, because removal has to beat a value
                        // left in the box: an operator who typed an address, changed their mind
                        // and ticked the box gets the removal they asked for rather than the
                        // address they abandoned.
                        //
                        // The untouched case leaves `config` exactly as the server answered, which
                        // is why this function is handed a freshly fetched configuration rather
                        // than an empty object. Writing an empty string here instead would delete
                        // the address on every save made for any other setting.
                        var typed = page.querySelector(entry).value;

                        if (page.querySelector(removal).checked) {
                            config.OutboundNoticeAddress = "";
                        } else if (typed) {
                            config.OutboundNoticeAddress = typed;
                        }

                        // The same three cases for the credential, in the same order.
                        typed = page.querySelector(keyEntry).value;

                        if (page.querySelector(keyRemoval).checked) {
                            config.BridgeApiKey = "";
                        } else if (typed) {
                            config.BridgeApiKey = typed;
                        }

                        return config;
                    }

                    page.addEventListener("pageshow", function () {
                        Dashboard.showLoadingMsg();

                        shell()
                            .then(function () {
                                return RequestsShell.load();
                            })
                            .then(function () {
                                RequestsShell.attach(page, "Requests");
                                RequestsShell.draw(page);

                                return ApiClient.getPluginConfiguration(RequestsConfig.pluginUniqueId);
                            })
                            .then(function (config) {
                                show(config);
                                Dashboard.hideLoadingMsg();
                            })
                            .catch(function () {
                                Dashboard.hideLoadingMsg();
                            });
                    });

                    document.querySelector("#RequestsConfigForm").addEventListener("submit", function (e) {
                        Dashboard.showLoadingMsg();
                        ApiClient.getPluginConfiguration(RequestsConfig.pluginUniqueId)
                            .then(function (config) {
                                return ApiClient.updatePluginConfiguration(RequestsConfig.pluginUniqueId, read(config));
                            })
                            .then(function (result) {
                                Dashboard.processPluginConfigurationUpdateResult(result);
                            })
                            // The plugin refuses settings it cannot run on rather than saving a
                            // corrected version of them, so a save can come back refused. Without
                            // this the loading indicator is hidden by nothing and the operator is
                            // left looking at a form that appears to have been accepted.
                            .catch(function () {
                                Dashboard.hideLoadingMsg();
                                RequestsShell.say(page, "config.refused");
                            });

                        e.preventDefault();
                        return false;
                    });
                })();
            </script>
        </div>
    </body>
</html>
