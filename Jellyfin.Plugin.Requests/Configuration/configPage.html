<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title data-i18n="config.title"></title>
    </head>
    <body>
        <div id="RequestsConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-select,emby-checkbox">
            <div data-role="content">
                <div class="content-primary">
                    <div class="requestsShell"></div>

                    <h2 data-i18n="config.heading"></h2>

                    <p class="requestsMessage" role="status"></p>

                    <form id="RequestsConfigForm">
                        <div class="inputContainer">
                            <label class="inputLabel inputLabelUnfocused" for="RequestsOpenRequestsPerUser" data-i18n="config.openRequestsPerUser.label"></label>
                            <input is="emby-input" type="number" id="RequestsOpenRequestsPerUser" min="1" step="1" required />
                            <div class="fieldDescription" data-i18n="config.openRequestsPerUser.description"></div>
                        </div>

                        <div class="checkboxContainer checkboxContainer-withDescription">
                            <label>
                                <input is="emby-checkbox" type="checkbox" id="RequestsAcceptsMovies" />
                                <span data-i18n="config.acceptsMovies.label"></span>
                            </label>
                            <div class="fieldDescription checkboxFieldDescription" data-i18n="config.acceptsKinds.description"></div>
                        </div>

                        <div class="checkboxContainer checkboxContainer-withDescription">
                            <label>
                                <input is="emby-checkbox" type="checkbox" id="RequestsAcceptsSeries" />
                                <span data-i18n="config.acceptsSeries.label"></span>
                            </label>
                        </div>

                        <div class="inputContainer">
                            <label class="inputLabel inputLabelUnfocused" for="RequestsFinishedRequestRetentionDays" data-i18n="config.retention.label"></label>
                            <input is="emby-input" type="number" id="RequestsFinishedRequestRetentionDays" min="30" step="1" required />
                            <div class="fieldDescription" data-i18n="config.retention.description"></div>
                        </div>

                        <div class="inputContainer">
                            <label class="inputLabel inputLabelUnfocused" for="RequestsOutboundNoticeAddress" data-i18n="config.outboundNoticeAddress.label"></label>
                            <input is="emby-input" type="url" id="RequestsOutboundNoticeAddress" />
                            <div class="fieldDescription" data-i18n="config.outboundNoticeAddress.description"></div>
                        </div>

                        <div class="checkboxContainer checkboxContainer-withDescription">
                            <label>
                                <input is="emby-checkbox" type="checkbox" id="RequestsTellsAdministratorsAboutArrivals" />
                                <span data-i18n="config.tellsAdministratorsAboutArrivals.label"></span>
                            </label>
                            <div class="fieldDescription checkboxFieldDescription" data-i18n="config.tellsAdministratorsAboutArrivals.description"></div>
                        </div>

                        <div class="checkboxContainer checkboxContainer-withDescription">
                            <label>
                                <input is="emby-checkbox" type="checkbox" id="RequestsAnnouncesApprovals" />
                                <span data-i18n="config.announcesApprovals.label"></span>
                            </label>
                            <div class="fieldDescription checkboxFieldDescription" data-i18n="config.announce.description"></div>
                        </div>

                        <div class="checkboxContainer checkboxContainer-withDescription">
                            <label>
                                <input is="emby-checkbox" type="checkbox" id="RequestsAnnouncesDeclines" />
                                <span data-i18n="config.announcesDeclines.label"></span>
                            </label>
                        </div>

                        <div class="checkboxContainer checkboxContainer-withDescription">
                            <label>
                                <input is="emby-checkbox" type="checkbox" id="RequestsAnnouncesFulfilments" />
                                <span data-i18n="config.announcesFulfilments.label"></span>
                            </label>
                        </div>

                        <div>
                            <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                                <span data-i18n="config.save"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <script type="text/javascript">
                var RequestsConfig = {
                    pluginUniqueId: "0f9c9107-b31b-459e-81fa-6d35dac25e79",
                };

                (function () {
                    var page = document.querySelector("#RequestsConfigPage");

                    // The shared script is fetched through the same endpoint the dashboard fetches
                    // this page from, because an embedded resource is reachable only under a name
                    // the plugin registered.
                    function shell() {
                        if (window.RequestsShell) {
                            return Promise.resolve();
                        }

                        return new Promise(function (resolve, reject) {
                            var script = document.createElement("script");
                            script.src = ApiClient.getUrl("web/ConfigurationPage", { name: "Requests.js" });
                            script.onload = resolve;
                            script.onerror = function () {
                                reject(new Error("The shared script for this plugin's pages could not be loaded."));
                            };
                            document.head.appendChild(script);
                        });
                    }

                    // One place names a setting and the field it is edited in. A second list would
                    // be the thing that goes stale when a setting is added, and the setting would
                    // then be one the page cannot reach while the page still looks complete.
                    var numbers = {
                        OpenRequestsPerUser: "#RequestsOpenRequestsPerUser",
                        FinishedRequestRetentionDays: "#RequestsFinishedRequestRetentionDays",
                    };

                    var switches = {
                        AcceptsMovies: "#RequestsAcceptsMovies",
                        AcceptsSeries: "#RequestsAcceptsSeries",
                        AnnouncesApprovals: "#RequestsAnnouncesApprovals",
                        AnnouncesDeclines: "#RequestsAnnouncesDeclines",
                        AnnouncesFulfilments: "#RequestsAnnouncesFulfilments",
                        TellsAdministratorsAboutArrivals: "#RequestsTellsAdministratorsAboutArrivals",
                    };

                    // Read and written as typed, with no trimming and no default put in its place.
                    // The server refuses an address it cannot post to and says which field, and a
                    // page that quietly repaired the value would be a page disagreeing with the
                    // file about what this install is set to.
                    var texts = {
                        OutboundNoticeAddress: "#RequestsOutboundNoticeAddress",
                    };

                    function show(config) {
                        Object.keys(numbers).forEach(function (setting) {
                            page.querySelector(numbers[setting]).value = config[setting];
                        });

                        Object.keys(switches).forEach(function (setting) {
                            page.querySelector(switches[setting]).checked = config[setting];
                        });

                        Object.keys(texts).forEach(function (setting) {
                            page.querySelector(texts[setting]).value = config[setting] || "";
                        });
                    }

                    function read(config) {
                        Object.keys(numbers).forEach(function (setting) {
                            config[setting] = parseInt(page.querySelector(numbers[setting]).value, 10);
                        });

                        Object.keys(switches).forEach(function (setting) {
                            config[setting] = page.querySelector(switches[setting]).checked;
                        });

                        Object.keys(texts).forEach(function (setting) {
                            config[setting] = page.querySelector(texts[setting]).value;
                        });

                        return config;
                    }

                    page.addEventListener("pageshow", function () {
                        Dashboard.showLoadingMsg();

                        shell()
                            .then(function () {
                                return RequestsShell.load();
                            })
                            .then(function () {
                                RequestsShell.attach(page, "Requests");
                                RequestsShell.draw(page);

                                return ApiClient.getPluginConfiguration(RequestsConfig.pluginUniqueId);
                            })
                            .then(function (config) {
                                show(config);
                                Dashboard.hideLoadingMsg();
                            })
                            .catch(function () {
                                Dashboard.hideLoadingMsg();
                            });
                    });

                    document.querySelector("#RequestsConfigForm").addEventListener("submit", function (e) {
                        Dashboard.showLoadingMsg();
                        ApiClient.getPluginConfiguration(RequestsConfig.pluginUniqueId)
                            .then(function (config) {
                                return ApiClient.updatePluginConfiguration(RequestsConfig.pluginUniqueId, read(config));
                            })
                            .then(function (result) {
                                Dashboard.processPluginConfigurationUpdateResult(result);
                            })
                            // The plugin refuses settings it cannot run on rather than saving a
                            // corrected version of them, so a save can come back refused. Without
                            // this the loading indicator is hidden by nothing and the operator is
                            // left looking at a form that appears to have been accepted.
                            .catch(function () {
                                Dashboard.hideLoadingMsg();
                                RequestsShell.say(page, "config.refused");
                            });

                        e.preventDefault();
                        return false;
                    });
                })();
            </script>
        </div>
    </body>
</html>
